version: '3.8'

services:
  client:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - plagshield-net

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/plagshield
    depends_on:
      - mongo
    networks:
      - plagshield-net

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - plagshield-net

volumes:
  mongo-data:

networks:
  plagshield-net:
    driver: bridge
